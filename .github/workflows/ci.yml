name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        run: ruff check wxapkg_v1mmwx.py

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q wxapkg_v1mmwx.py

      - name: CLI smoke test
        run: |
          python wxapkg_v1mmwx.py --help
          python wxapkg_v1mmwx.py info --help
          python wxapkg_v1mmwx.py unpack --help
          python wxapkg_v1mmwx.py extract --help
          python wxapkg_v1mmwx.py batch --help
